<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering programme illustration">
  <circle cx="100" cy="100" r="94" fill="rgba(255,255,255,.08)"/>
  <circle cx="100" cy="100" r="72" fill="rgba(255,255,255,.06)"/>

  <!-- gear -->
  <g transform="translate(100,98)">
    <g fill="#ffffff">
      <rect x="-6" y="-52" width="12" height="18" rx="3"/>
      <rect x="-6" y="34" width="12" height="18" rx="3"/>
      <rect x="-52" y="-6" width="18" height="12" rx="3"/>
      <rect x="34" y="-6" width="18" height="12" rx="3"/>
      <rect x="-6" y="-52" width="12" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-6" y="34" width="12" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-52" y="-6" width="18" height="12" rx="3" transform="rotate(45)"/>
      <rect x="34" y="-6" width="18" height="12" rx="3" transform="rotate(45)"/>
    </g>
    <circle r="34" fill="#ffffff"/>
    <circle r="14" fill="#123b6d"/>
  </g>

  <!-- wrench accent -->
  <g transform="translate(128,132) rotate(35)">
    <rect x="-4" y="-30" width="8" height="46" rx="4" fill="#f2d27f"/>
    <circle cx="0" cy="-32" r="10" fill="none" stroke="#f2d27f" stroke-width="6"/>
  </g>
</svg>
